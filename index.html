<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EcoConnect · Una mejor experiencia en campings rurales</title>
  <meta name="description" content="Prototipo de EcoConnect: mapa, pedidos y reportes para campings rurales. Funciona sin señal.">
  <meta name="theme-color" content="#17543a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- Íconos (se reutilizan con <use href="#id">) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="ic-map" viewBox="0 0 24 24"><path d="M9 4 3 6.500v13L9 17l6 3 6-2.5v-13L15 7 9 4zM9 4v13M15 7v13"/></symbol>
    <symbol id="ic-flame" viewBox="0 0 24 24"><path d="M12 2.5c.5 3.2 5.5 5.5 5.5 11a5.5 5.5 0 0 1-11 0c0-2.2 1-3.7 2.2-4.800.2 1.4.8 2.3 1.6 2.800C10.2 8.5 10.8 5.3 12 2.5zM12 20a2.5 2.5 0 0 1-2.5-2.5c0-1.4 1.2-2 2.5-3.500 1.300 1.500 2.5 2.100 2.5 3.500A2.5 2.5 0 0 1 12 20z"/></symbol>
    <symbol id="ic-alert" viewBox="0 0 24 24"><path d="M12 4 2.8 19.500h18.400L12 4zM12 10v4.500M12 17.200v.1"/></symbol>
    <symbol id="ic-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></symbol>
    <symbol id="ic-drop" viewBox="0 0 24 24"><path d="M12 3.500s6 6.2 6 10.500a6 6 0 0 1-12 0c0-4.3 6-10.5 6-10.500z"/></symbol>
    <symbol id="ic-toilet" viewBox="0 0 24 24"><path d="M8 3h8v6H8zM4.5 11h15l-1.2 3.2c-.8 2.6-3.2 4.8-6.3 4.8s-5.5-2.2-6.3-4.8L4.5 11zM9 21h6"/></symbol>
    <symbol id="ic-bolt" viewBox="0 0 24 24"><path d="M13 3 5 13.500h6L10 21l8-10.500h-6L13 3z"/></symbol>
    <symbol id="ic-food" viewBox="0 0 24 24"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 1.5-3 4-3 7h3v11M17 3v7"/></symbol>
    <symbol id="ic-box" viewBox="0 0 24 24"><path d="M3.5 7.5 12 3l8.5 4.500v9L12 21l-8.5-4.500v-9zM3.5 7.5 12 12l8.5-4.500M12 12v9"/></symbol>
    <symbol id="ic-camera" viewBox="0 0 24 24"><path d="M4 8h3l1.5-2.5h7L17 8h3v11H4V8zM12 16.500a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/></symbol>
    <symbol id="ic-check" viewBox="0 0 24 24"><path d="M5 12.5 10 17.5 19 7"/></symbol>
    <symbol id="ic-clock" viewBox="0 0 24 24"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2"/></symbol>
    <symbol id="ic-sync" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.5-4M4 13a8 8 0 0 0 14.5 4M5.5 3v4h4M18.5 21v-4h-4"/></symbol>
    <symbol id="ic-tent" viewBox="0 0 24 24"><path d="M12 4 3 20h18L12 4zM9.5 20 12 14.5 14.5 20"/></symbol>
    <symbol id="ic-signal" viewBox="0 0 24 24"><path d="M4 19v-3M9 19v-6M14 19V9M19 19V5"/></symbol>
    <symbol id="ic-signal-off" viewBox="0 0 24 24"><path d="M4 19v-3M9 19v-6M14 19V9M19 19V5M3 3l18 18"/></symbol>
    <symbol id="ic-building" viewBox="0 0 24 24"><path d="M4 20V8l8-4 8 4v12M9 20v-6h6v6M3 20h18"/></symbol>
    <symbol id="ic-trash" viewBox="0 0 24 24"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13M10 11v6M14 11v6"/></symbol>
    <symbol id="ic-sound" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4H4zM16.5 9a4 4 0 0 1 0 6M19 6.500a8 8 0 0 1 0 11"/></symbol>
    <symbol id="ic-sound-off" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4H4zM17 9l5 6M22 9l-5 6"/></symbol>
    <symbol id="ic-music" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM20 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/></symbol>
    <symbol id="ic-user" viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4.2 3.6-7 8-7s8 2.8 8 7"/></symbol>
    <symbol id="ic-download" viewBox="0 0 24 24"><path d="M12 4v11M7.5 11 12 15.5 16.5 11M5 20h14"/></symbol>
    <symbol id="ic-cloud" viewBox="0 0 24 24"><path d="M7 18a4.5 4.5 0 0 1-.6-8.960A6 6 0 0 1 18 9.5 4 4 0 0 1 17.5 18H7z"/></symbol>
    <symbol id="tree" viewBox="-10 -16 20 28"><path d="M0-14 9 4H-9z" fill="#2f7a4e" stroke="none"/><rect x="-1.5" y="4" width="3" height="5" fill="#7b5a3a" stroke="none"/></symbol>
  </defs>
</svg>

<div class="stage">
  <aside class="brand-aside" aria-hidden="true">
    <svg class="brand-mark" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#f0a93a"/><path d="M50 22 78 74H22z" fill="#17543a"/><path d="M50 50 62 74H38z" fill="#f0a93a"/></svg>
    <p class="brand-name">EcoConnect</p>
    <p class="brand-tag">Una mejor experiencia en campings rurales</p>
    <p class="brand-note">Prototipo del Laboratorio de Desafíos de la Innovación<br>Universidad Autónoma de Chile</p>
  </aside>

  <div class="app" id="app" data-route="mapa">
    <header class="topbar" id="topbar">
      <a class="logo" href="#" data-action="home" aria-label="EcoConnect, ir al mapa">
        <svg class="logo-mark" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="#f0a93a"/><path d="M50 22 78 74H22z" fill="#17543a"/><path d="M50 50 62 74H38z" fill="#f0a93a"/></svg>
        <span class="logo-word">EcoConnect</span>
      </a>
      <button class="pill" id="signalPill" type="button" data-action="toggle-signal" aria-live="polite"></button>
      <span class="pill pill-admin" id="adminTag" hidden>Administración</span>
    </header>

    <main id="view" tabindex="-1"></main>

    <nav class="tabbar" id="tabbar" aria-label="Secciones">
      <button type="button" class="tab" data-action="tab" data-tab="mapa"><svg class="ico" aria-hidden="true"><use href="#ic-map"/></svg><span>Mapa</span></button>
      <button type="button" class="tab" data-action="tab" data-tab="pedir"><svg class="ico" aria-hidden="true"><use href="#ic-flame"/></svg><span>Pedir</span></button>
      <button type="button" class="tab" data-action="tab" data-tab="reportar"><svg class="ico" aria-hidden="true"><use href="#ic-alert"/></svg><span>Reportar</span></button>
      <button type="button" class="tab" data-action="tab" data-tab="estado"><svg class="ico" aria-hidden="true"><use href="#ic-list"/></svg><span>Estado</span><i class="badge" id="badge" hidden></i></button>
    </nav>

    <!-- Momento de sincronización (escena 5 del storyboard) -->
    <div class="sync" id="syncOverlay" hidden role="alertdialog" aria-live="assertive" aria-label="Sincronización">
      <div class="sync-body">
        <div class="sync-ring" id="syncRing"><svg class="ico" aria-hidden="true"><use href="#ic-sync"/></svg></div>
        <p class="sync-title" id="syncTitle"></p>
        <p class="sync-text" id="syncText"></p>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/sound.js"></script>
<script src="js/app.js"></script>
</body>
</html>
